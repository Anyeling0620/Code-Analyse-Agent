name: Build and Release

# 只负责「构建 + 发布产物」：每次 push 到 main 构建一次，发布两个 Release：
#   release-latest  滚动最新（每次推送更新）
#   release-2.0     当前 2.x 版本线（每次推送更新；升级到 3.0 时改 CURRENT_RELEASE_TAG）
# 服务器侧通过 RELEASE_TAG 选择要部署的 Release；release-1.0 是改造前版本的冻结快照。
# 标签统一使用「release-<版本号>」形式（连字符分隔）。
# 不再从 Runner 反向 SSH/SCP 推送到服务器；服务器侧定时拉取选定的 Release 完成部署。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

# 当前版本线。升级大版本时改这里（例如 release-3.0）；
# release-latest 始终滚动，versioned tag 在升级后自然冻结在上一次构建。
env:
  CURRENT_RELEASE_TAG: release-2.0
  ROLLING_RELEASE_TAG: release-latest

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install Gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build Backend
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          go mod tidy
          go build -o code-analyse-agent .

      - name: Verify Binary
        run: |
          file code-analyse-agent
          file code-analyse-agent | grep -q "ELF 64-bit" || (echo "not linux elf" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Package Artifacts
        run: |
          set -euo pipefail
          gzip -9 -f -k code-analyse-agent
          tar -czf web-dist.tar.gz -C web/dist .
          ls -lh code-analyse-agent.gz web-dist.tar.gz

      - name: Write version.json
        run: |
          set -euo pipefail
          BIN_SHA="$(sha256sum code-analyse-agent.gz | awk '{print $1}')"
          WEB_SHA="$(sha256sum web-dist.tar.gz | awk '{print $1}')"
          cat > version.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "run": "${{ github.run_number }}",
            "release_tag": "${{ env.CURRENT_RELEASE_TAG }}",
            "rolling_release_tag": "${{ env.ROLLING_RELEASE_TAG }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "code-analyse-agent.gz": { "sha256": "$BIN_SHA", "size": $(stat -c%s code-analyse-agent.gz) },
              "web-dist.tar.gz": { "sha256": "$WEB_SHA", "size": $(stat -c%s web-dist.tar.gz) }
            }
          }
          EOF
          cat version.json

      - name: Publish rolling and versioned releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(printf 'commit: %s\nrun: %s\nrelease: %s\nrolling: %s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$CURRENT_RELEASE_TAG" "$ROLLING_RELEASE_TAG")
          # 先发版本线，再发 rolling release，确保 GitHub 的 Latest 标记落在 release-latest 上。
          for tag in "$CURRENT_RELEASE_TAG" "$ROLLING_RELEASE_TAG"; do
            echo "== publishing $tag =="
            # rolling/current version 标签随每次推送移动；release-1.0 等冻结版本不经过这里。
            git tag -f "$tag" "$GITHUB_SHA"
            git push -f origin "refs/tags/$tag"
            latest_arg=()
            if [ "$tag" = "$ROLLING_RELEASE_TAG" ]; then
              latest_arg=(--latest)
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" code-analyse-agent.gz web-dist.tar.gz version.json --clobber
              gh release edit "$tag" --title "$tag" --notes "$notes" "${latest_arg[@]}"
            else
              gh release create "$tag" code-analyse-agent.gz web-dist.tar.gz version.json \
                --title "$tag" --notes "$notes" --target "$GITHUB_SHA" "${latest_arg[@]}"
            fi
          done

      - name: Summary
        run: |
          {
            echo "### 产物已发布"
            echo
            echo "| Release | 文件 | 大小 | sha256 |"
            echo "| --- | --- | --- | --- |"
            for tag in "$ROLLING_RELEASE_TAG" "$CURRENT_RELEASE_TAG"; do
              echo "| $tag | code-analyse-agent.gz | $(stat -c%s code-analyse-agent.gz) | \`$(sha256sum code-analyse-agent.gz | awk '{print $1}')\` |"
              echo "| $tag | web-dist.tar.gz | $(stat -c%s web-dist.tar.gz) | \`$(sha256sum web-dist.tar.gz | awk '{print $1}')\` |"
            done
            echo
            echo "commit: \`$GITHUB_SHA\`"
            echo
            echo "服务器端通过 \`RELEASE_TAG\` 选择要部署的 Release；默认 \`release-latest\`。"
          } >> "$GITHUB_STEP_SUMMARY"
