name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install Gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          go mod tidy
          go build -o code-analyse-agent .

      - name: Verify Binary
        run: |
          file code-analyse-agent
          file code-analyse-agent | grep -q "ELF 64-bit" || (echo "not linux elf" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Package Frontend
        run: tar -czf web-dist.tar.gz -C web/dist .

      - name: Publish Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-latest
          files: |
            code-analyse-agent
            web-dist.tar.gz
          fail_on_unmatched_files: true

      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            # ---- 后端 ----
            cd /www/server/analyse.jxutcm.top
            URL="https://ghfast.top/https://github.com/${{ github.repository }}/releases/download/deploy-latest/code-analyse-agent"
            rm -f code-analyse-agent.new
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 -o code-analyse-agent.new "$URL" \
              || curl -fsSL --noproxy '*' --retry 3 --connect-timeout 10 -o code-analyse-agent.new "$URL"
            test -s code-analyse-agent.new
            chmod +x code-analyse-agent.new
            mv -f code-analyse-agent.new code-analyse-agent
            systemctl restart code-analyse-agent
            sleep 2
            systemctl status code-analyse-agent --no-pager
            curl -fsS --max-time 5 http://127.0.0.1:8088/healthz && echo "backend healthz ok"

            # ---- 前端 ----
            cd /www/wwwroot/analyse.jxutcm.top
            WEB_URL="https://ghfast.top/https://github.com/${{ github.repository }}/releases/download/deploy-latest/web-dist.tar.gz"
            rm -rf .incoming
            mkdir -p .incoming
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 10 -o .incoming/dist.tar.gz "$WEB_URL" \
              || curl -fsSL --noproxy '*' --retry 3 --connect-timeout 10 -o .incoming/dist.tar.gz "$WEB_URL"
            test -s .incoming/dist.tar.gz
            tar -xzf .incoming/dist.tar.gz -C .incoming
            test -f .incoming/index.html
            rm -f .incoming/dist.tar.gz
            rm -rf assets index.html
            cp -a .incoming/. .
            rm -rf .incoming
            chmod -R a+rX . 2>/dev/null || true
            ls -1
