name: Build and Release

# 只负责「构建 + 发布产物」：构建后把产物发到 Release（tag: deploy-latest），
# 不再从 Runner 反向 SSH/SCP 推送到服务器；服务器侧定时拉取该 Release 完成部署。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Install Gcc
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build Backend
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          go mod tidy
          go build -o code-analyse-agent .

      - name: Verify Binary
        run: |
          file code-analyse-agent
          file code-analyse-agent | grep -q "ELF 64-bit" || (echo "not linux elf" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Package Artifacts
        run: |
          set -euo pipefail
          gzip -9 -f -k code-analyse-agent
          tar -czf web-dist.tar.gz -C web/dist .
          ls -lh code-analyse-agent.gz web-dist.tar.gz

      - name: Write version.json
        run: |
          set -euo pipefail
          BIN_SHA="$(sha256sum code-analyse-agent.gz | awk '{print $1}')"
          WEB_SHA="$(sha256sum web-dist.tar.gz | awk '{print $1}')"
          cat > version.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "run": "${{ github.run_number }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": {
              "code-analyse-agent.gz": { "sha256": "$BIN_SHA", "size": $(stat -c%s code-analyse-agent.gz) },
              "web-dist.tar.gz": { "sha256": "$WEB_SHA", "size": $(stat -c%s web-dist.tar.gz) }
            }
          }
          EOF
          cat version.json

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deploy-latest
          name: deploy-latest
          body: |
            commit: ${{ github.sha }}
            run: ${{ github.run_number }}
          files: |
            code-analyse-agent.gz
            web-dist.tar.gz
            version.json
          fail_on_unmatched_files: true

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${{ github.repository }}/releases/tags/deploy-latest"
          ids="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
                 | jq -r '.assets[] | select(.name=="code-analyse-agent") | .id' || true)"
          for id in $ids; do
            echo "deleting stale asset id=$id"
            curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/$id" || true
          done

      - name: Summary
        run: |
          {
            echo "### 产物已发布到 Release \`deploy-latest\`"
            echo
            echo "| 文件 | 大小 | sha256 |"
            echo "| --- | --- | --- |"
            echo "| code-analyse-agent.gz | $(stat -c%s code-analyse-agent.gz) | \`$(sha256sum code-analyse-agent.gz | awk '{print $1}')\` |"
            echo "| web-dist.tar.gz | $(stat -c%s web-dist.tar.gz) | \`$(sha256sum web-dist.tar.gz | awk '{print $1}')\` |"
            echo
            echo "commit: \`${{ github.sha }}\`"
            echo
            echo "服务器端会在 1 分钟内自动拉取并部署这些产物。"
          } >> "$GITHUB_STEP_SUMMARY"
